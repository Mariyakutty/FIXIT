<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixTrace - Secure Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: #f8fafc;
        color: #334155;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 2.5rem;
        border-radius: 1rem;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.05);
        border: 1px solid #f1f5f9;
      }
      .header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .brand {
        font-size: 1.875rem;
        font-weight: 800;
        color: #4f46e5;
        letter-spacing: -0.025em;
      }
      .subtitle {
        color: #64748b;
        margin-top: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .form-group {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 0.5rem;
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        font-size: 1rem;
        transition: all 0.2s;
      }
      input:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        font-weight: 500;
        margin-top: 0.25rem;
        margin-bottom: 1.25rem;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        color: #64748b;
        cursor: pointer;
      }
      .checkbox-label input {
        margin-right: 0.5rem;
        accent-color: #4f46e5;
      }
      .link {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
      }
      .link:hover {
        color: #4338ca;
      }
      button {
        width: 100%;
        padding: 0.875rem;
        background-color: #4f46e5;
        color: #ffffff;
        font-weight: 600;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.1);
        transition: all 0.2s;
      }
      button:hover {
        background-color: #4338ca;
      }
      button:active {
        transform: scale(0.99);
      }
      .footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #f1f5f9;
        font-size: 0.875rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="brand">FixTrace</div>
        <div class="subtitle">
          Welcome back! Please sign in to your account.
        </div>
      </div>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="name@company.com"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="••••••••"
          />
        </div>

        <div class="row">
          <label class="checkbox-label">
            <input type="checkbox" /> Remember me
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit">Sign In</button>
      </form>

      <div class="footer">
        Don't have an account yet?
        <a href="/register" class="link">Create an account</a>
      </div>
    </div>
  </body>
</html>
